name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Extract version from tag
        id: version
        run: |
          # Extract version from tag (remove 'v' prefix)
          $VERSION = $env:GITHUB_REF -replace 'refs/tags/v', ''
          echo "version=$VERSION" >> $env:GITHUB_OUTPUT
          echo "tag=$env:GITHUB_REF_NAME" >> $env:GITHUB_OUTPUT
          # Check if it's a prerelease (contains alpha, beta, rc, etc.)
          if ($VERSION -match "(alpha|beta|rc|pre)") {
            echo "prerelease=true" >> $env:GITHUB_OUTPUT
          } else {
            echo "prerelease=false" >> $env:GITHUB_OUTPUT
          }
        shell: pwsh

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Update package version
        run: npm version ${{ steps.version.outputs.version }} --no-git-tag-version

      - name: Build Windows
        if: matrix.os == 'windows-latest'
        run: npm run app:build -- --publish never

      - name: Build Linux
        if: matrix.os == 'ubuntu-latest'
        run: npm run app:build:linux -- --publish never

      - name: Upload Windows artifacts
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v5
        with:
          name: windows-build
          path: |
            releases/${{ steps.version.outputs.version }}/*.exe
            releases/${{ steps.version.outputs.version }}/*.nsis.7z

      - name: Upload Linux artifacts
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v5
        with:
          name: linux-build
          path: |
            releases/${{ steps.version.outputs.version }}/*.AppImage
            releases/${{ steps.version.outputs.version }}/*.deb
            releases/${{ steps.version.outputs.version }}/*.rpm

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$GITHUB_REF_NAME" >> $GITHUB_OUTPUT
          if [[ "$VERSION" =~ (alpha|beta|rc|pre) ]]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Download all artifacts
        uses: actions/download-artifact@v5

      - name: List downloaded files
        run: |
          find . -type f -name "*.exe" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.rpm"

      - name: Ensure release exists
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          TITLE="Release $TAG"
          NOTES=$(cat <<'EOF'
          ### Downloads
          - **Windows**: `.exe` installer
          - **Linux**:
            - `.AppImage` - Portable application
            - `.deb` - For Ubuntu/Debian systems
            - `.rpm` - For Red Hat/Fedora/CentOS systems
          EOF
          )

          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "${{ steps.version.outputs.prerelease }}" = "true" ]; then
              gh release edit "$TAG" --title "$TITLE" --prerelease
            else
              gh release edit "$TAG" --title "$TITLE"
            fi
          else
            if [ "${{ steps.version.outputs.prerelease }}" = "true" ]; then
              gh release create "$TAG" --title "$TITLE" --generate-notes --notes "$NOTES" --prerelease
            else
              gh release create "$TAG" --title "$TITLE" --generate-notes --notes "$NOTES"
            fi
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      - name: Upload release assets
        run: |
          TAG="${{ steps.version.outputs.tag }}"

          mapfile -d '' files < <(find windows-build linux-build -maxdepth 1 -type f \( -name "*.exe" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.rpm" -o -name "*.blockmap" -o -name "latest*.yml" \) -print0)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release assets found to upload."
            exit 1
          fi

          gh release upload "$TAG" --clobber "${files[@]}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
