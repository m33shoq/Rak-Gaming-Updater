<!doctype html>
<!--
	The app normally installs this file into the current OBS Program scene over
	OBS WebSocket. Manual fallback setup:
	- Add this file as a local Browser Source.
	- Use a 1920x1080 browser viewport and place it at canvas position 0,0.
	- Do not crop the source. Keep it visible for the whole broadcast.
	The encoded strip records the streaming PC's wall-clock time using Date.now().
	Keeping that clock uncorrected makes it share the same clock domain as a WoW
	combat log recorded on the same PC. The overlay does not contact WCL or any
	other remote service.
-->
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>RG stream sync marker</title>
	<style>
		html, body {
			width: 100%;
			height: 100%;
			margin: 0;
			overflow: hidden;
			background: transparent;
		}

		#code {
			position: absolute;
			left: 0;
			top: 4px;
			width: 6px;
			height: 128px;
			image-rendering: pixelated;
		}
	</style>
</head>
<body>
	<canvas id="code" width="6" height="128"></canvas>
	<script>
		// Vertical-strip format (version 4): the low 16 bits of UNIX deciseconds and
		// CRC-8 are packed into twelve base-4 symbols. Four leading symbols
		// calibrate the four luminance levels after video compression. The app
		// reconstructs the nearest timestamp cycle from YouTube metadata.
		const canvas = document.getElementById('code');
		const context = canvas.getContext('2d');
		const CELL_WIDTH = 6;
		const CELL_HEIGHT = 8;
		const FORMAT_TAG = 0xa4;
		const MODULO_TIMESTAMP_TICKS = 1 << 16;
		const CALIBRATION_SYMBOLS = [0, 3, 1, 2];
		const SYMBOL_LEVELS = ['#101820', '#566068', '#9da7ae', '#eef7fb'];

		function crc8(bytes) {
			let crc = 0;
			for (const byte of bytes) {
				crc ^= byte;
				for (let bit = 0; bit < 8; bit++) {
					crc = (crc & 0x80) !== 0
						? ((crc << 1) ^ 0x07) & 0xff
						: (crc << 1) & 0xff;
				}
			}
			return crc;
		}

		function encode(timestampMs) {
			const timestampTicks = Math.floor(timestampMs / 100);
			const moduloTimestampTicks = ((timestampTicks % MODULO_TIMESTAMP_TICKS) + MODULO_TIMESTAMP_TICKS)
				% MODULO_TIMESTAMP_TICKS;
			const checksum = crc8(new Uint8Array([
				FORMAT_TAG,
				(moduloTimestampTicks >>> 16) & 0x03,
				(moduloTimestampTicks >>> 8) & 0xff,
				moduloTimestampTicks & 0xff,
			]));
			let encodedPayload = moduloTimestampTicks * 256 + checksum;
			const symbols = new Uint8Array(16);
			symbols.set(CALIBRATION_SYMBOLS);
			for (let index = 11; index >= 0; index--) {
				symbols[CALIBRATION_SYMBOLS.length + index] = encodedPayload & 0x03;
				encodedPayload = Math.floor(encodedPayload / 4);
			}
			return symbols;
		}

		function render() {
			const nowMs = Date.now();
			const timestampMs = Math.floor(nowMs / 100) * 100;
			const symbols = encode(timestampMs);
			context.fillStyle = '#05080b';
			context.fillRect(0, 0, canvas.width, canvas.height);

			for (let index = 0; index < symbols.length; index++) {
				context.fillStyle = SYMBOL_LEVELS[symbols[index]];
				context.fillRect(0, index * CELL_HEIGHT, CELL_WIDTH, CELL_HEIGHT);
			}
			const tickProgressMs = ((nowMs % 100) + 100) % 100;
			setTimeout(render, Math.max(20, 100 - tickProgressMs));
		}

		render();
	</script>
</body>
</html>
